name: Deploy to GitHub Pages

# 触发：推送到 main，或在 Actions 页面手动点一次
on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 发布所需的最小权限：读代码、写 Pages、OIDC
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个发布，新推送排队而不打断进行中的发布
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # enablement: true 让仓库首次部署时就自动开通 Pages（Source 设为 GitHub Actions），
      # 否则需要人工去 Settings → Pages 点一次。
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # 这里必须用 npm install 而不是 npm ci。
      # 锁文件是在 Windows 上生成的，不含 @rollup/rollup-linux-x64-gnu 这类
      # 平台专属可选依赖（npm 已知问题 #4828）；npm ci 严格照锁文件装，
      # 于是 rollup 在 ubuntu 上找不到原生模块，build 直接报
      # "Cannot find module @rollup/rollup-linux-x64-gnu"。
      # npm install 会按当前平台把可选依赖补齐。
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
